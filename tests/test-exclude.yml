name: Test exclude pattern skips bad files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures
          reporter: local
          filter_mode: nofilter
          level: info
          fail_level: any
          reviewdog_flags: -reporter=local
          exclude: |
            */.git/*
            */bad/*
      - name: Assert action succeeded with bad dir excluded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when bad files are excluded"
            exit 1
          fi
          echo "PASS"
