name: Test shellcheck with warning level reporting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          level: warning
          fail_level: warning
          path: tests/fixtures/warning-level
          pattern: "*.sh"
          shellcheck_flags: "--external-sources"
          reviewdog_flags: "-reporter=local"

      - name: Assert action failed due to warnings with fail_level=warning
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: shellcheck correctly reported warnings and failed with fail_level=warning"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected shellcheck to find warnings and fail, but action succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
