name: Test check_all_files_with_shebangs detects extensionless script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/shebang
          pattern: '*.sh'
          check_all_files_with_shebangs: 'true'
          reporter: local
          filter_mode: nofilter
          fail_level: any
      - name: Assert extensionless shebang script was checked
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because the shebang script has issues"
            exit 1
          fi
          echo "PASS"
