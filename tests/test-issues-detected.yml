name: Test issues detected - script with shellcheck errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a shell script with shellcheck issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-issues"
          cat > "$GITHUB_WORKSPACE/tests/tmp-issues/bad.sh" << 'EOF'
          #!/usr/bin/env bash
          echo $1
          find . -name *.ogg
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: warning
          level: warning
          path: tests/tmp-issues
          pattern: "*.sh"
          shellcheck_flags: "--external-sources"
          reviewdog_flags: "-reporter=local"

      - name: Assert action detected issues and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when shellcheck found issues"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed due to shellcheck errors"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
