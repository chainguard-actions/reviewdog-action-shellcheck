name: Test no matching files - action exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory with no shell scripts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-no-match"
          echo "This is a text file" > "$GITHUB_WORKSPACE/tests/tmp-no-match/readme.txt"
          echo "console.log('hello');" > "$GITHUB_WORKSPACE/tests/tmp-no-match/app.js"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          path: tests/tmp-no-match
          pattern: "*.sh"
          shellcheck_flags: "--external-sources"
          reviewdog_flags: "-reporter=local"

      - name: Assert action succeeded gracefully with no matching files
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited gracefully when no matching files were found"
          else
            echo "FAIL: action should have succeeded gracefully, got '$OUTCOME'"
            exit 1
          fi
