name: Test fail_level - detect shellcheck errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: error
          path: tests/fixtures/bad
          pattern: "*.sh"
          shellcheck_flags: "--external-sources"

      - name: Assert action failed (shellcheck issues detected or sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed (shellcheck found issues with fail_level=error, or sentinel repo caused failure)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail due to shellcheck issues, but it succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
