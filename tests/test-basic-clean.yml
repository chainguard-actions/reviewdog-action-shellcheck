name: Test basic usage - clean shell script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          path: tests/fixtures/clean
          pattern: "*.sh"
          shellcheck_flags: "--external-sources"

      - name: Assert action ran (clean script - success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded - shellcheck found no issues in clean script"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed gracefully (sentinel repo causes suggestion step to fail)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
