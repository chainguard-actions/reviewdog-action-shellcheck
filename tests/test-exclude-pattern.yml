name: Test shellcheck with exclude pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          path: tests/fixtures/exclude
          pattern: "*.sh"
          exclude: "*/vendor/*"
          shellcheck_flags: "--external-sources"
          reviewdog_flags: "-reporter=local"

      - name: Assert action succeeded (bad script in vendor/ was excluded)
        run: |
          echo "Action completed successfully (vendor/ scripts excluded from check)"
          echo "PASS"
