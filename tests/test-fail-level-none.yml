name: Test shellcheck with fail_level=none always exits 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          path: tests/fixtures/fail-level-none
          pattern: "*.sh"
          shellcheck_flags: "--external-sources"
          reviewdog_flags: "-reporter=local"

      - name: Assert action succeeded even with shellcheck errors (fail_level=none)
        run: |
          echo "Action completed successfully (fail_level=none means always exit 0)"
          echo "PASS"
