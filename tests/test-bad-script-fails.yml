name: Test bad script fails with fail_level any
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/bad
          reporter: local
          filter_mode: nofilter
          level: info
          fail_level: any
          reviewdog_flags: -reporter=local
      - name: Assert action failed on shellcheck findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure due to shellcheck issues"
            exit 1
          fi
          echo "PASS"
